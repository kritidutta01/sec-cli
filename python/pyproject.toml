[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seccli"
version = "0.1.0"
description = "Python wrapper for sec-cli: structured SEC EDGAR filings for LLM consumption"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kriti Dutta" }]
keywords = ["sec", "edgar", "xbrl", "filings", "llm"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kritidutta01/sec-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/seccli"]

[tool.hatch.build.targets.sdist]
include = ["src/seccli", "README.md"]
