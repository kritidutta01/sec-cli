name: Release

# Tag-driven release: goreleaser builds the cross-platform no-cgo binaries and
# publishes them to GitHub Releases; the python job builds wheels that bundle the
# matching binary and publishes them to PyPI. The git tag is the single version
# source — it drives the binary `version` string (via -ldflags) and the wheel
# version.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wheels:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The wheel-build step is expected to download the matching binary from the
      # GitHub Release this tag just published (or build it) and drop it under
      # python/src/seccli/_bin/ before `python -m build`. Wired when PyPI
      # credentials are configured.
      - name: Build sdist and wheel
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: python/dist
